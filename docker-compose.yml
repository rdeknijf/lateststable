# Portable local run: `docker compose up --build` → http://localhost:3000.
# Production runs on k3s (image built to GHCR by CI, SHA-pinned by a private GitOps
# repo); routing/TLS there is the cluster ingress's job, not a compose label.
services:
  lateststable:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
